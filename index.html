<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EcoCarga - Chile</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }

        html, body { height: 100%; margin: 0; overflow: hidden; }

        /* Full-screen map behind everything */
        #map {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* ── Header ── */
        #app-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 40;
        }

        /* ── Chip bar ── */
        #chip-bar {
            position: fixed;
            top: 68px; left: 0; right: 0;
            z-index: 40;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #chip-bar::-webkit-scrollbar { display: none; }

        /* ── Glassmorphism ── */
        .glass {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ── Chip styles ── */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            background: rgba(255,255,255,0.88);
            border: 1.5px solid rgba(0,0,0,0.08);
            color: #334155;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .chip.active {
            background: #10b981;
            border-color: #10b981;
            color: #fff;
            box-shadow: 0 4px 14px rgba(16,185,129,0.4);
        }

        /* ── Pulsing marker ── */
        @keyframes pulse-ring {
            0%   { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }
        .pin-wrapper {
            position: relative;
            width: 22px;
            height: 22px;
        }
        .pin-dot {
            position: absolute;
            inset: 4px;
            border-radius: 50%;
        }
        .pin-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            animation: pulse-ring 1.6s cubic-bezier(0.215,0.61,0.355,1) infinite;
        }
        .pin-green  .pin-dot  { background: #10b981; box-shadow: 0 0 0 2px #fff; }
        .pin-green  .pin-ring { background: rgba(16,185,129,0.45); }
        .pin-amber  .pin-dot  { background: #f59e0b; box-shadow: 0 0 0 2px #fff; }
        .pin-amber  .pin-ring { background: rgba(245,158,11,0.45); }

        /* ── Bottom Sheet ── */
        #bottom-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
            max-width: 480px;
            margin: 0 auto;
            border-radius: 24px 24px 0 0;
        }
        #bottom-sheet.open {
            transform: translateY(0);
        }

        /* ── Sheet overlay ── */
        #sheet-overlay {
            position: fixed;
            inset: 0;
            z-index: 45;
            background: rgba(0,0,0,0);
            pointer-events: none;
            transition: background 0.3s;
        }
        #sheet-overlay.active {
            background: rgba(0,0,0,0.35);
            pointer-events: auto;
        }

        /* Hide Leaflet attribution on mobile for cleaner look */
        .leaflet-control-attribution { font-size: 9px !important; }

        /* Waze button gradient */
        .btn-waze {
            background: linear-gradient(135deg, #33ccff 0%, #0099cc 100%);
            box-shadow: 0 4px 18px rgba(0,153,204,0.4);
        }
        .btn-waze:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <!-- ══════════════ MAP ══════════════ -->
    <div id="map"></div>

    <!-- ══════════════ HEADER ══════════════ -->
    <header id="app-header">
        <div class="glass mx-3 mt-3 rounded-2xl px-4 py-3 flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-2">
                <span class="bg-emerald-500 text-white rounded-xl p-1.5 text-sm leading-none">
                    <i class="fa-solid fa-bolt"></i>
                </span>
                <h1 class="text-lg font-extrabold text-slate-800 tracking-tight">
                    Eco<span class="text-emerald-500">Carga</span>
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-500 bg-slate-100 rounded-full px-2.5 py-1">
                    <i class="fa-solid fa-location-dot text-emerald-500 mr-1"></i>Santiago
                </span>
            </div>
        </div>
    </header>

    <!-- ══════════════ CHIP BAR ══════════════ -->
    <div id="chip-bar">
        <div class="flex gap-2 px-4 py-2">
            <button class="chip active" data-filter="all">🗺️ Todas</button>
            <button class="chip" data-filter="rapida">⚡ Rápida</button>
            <button class="chip" data-filter="disponible">🟢 Disponible</button>
            <button class="chip" data-filter="ccs2">🔌 CCS2</button>
            <button class="chip" data-filter="copec">⛽ Copec</button>
        </div>
    </div>

    <!-- ══════════════ SHEET OVERLAY ══════════════ -->
    <div id="sheet-overlay"></div>

    <!-- ══════════════ BOTTOM SHEET ══════════════ -->
    <div id="bottom-sheet" class="glass px-5 pt-3 pb-8 shadow-2xl">
        <!-- Drag handle -->
        <div class="flex justify-center mb-4">
            <div class="w-10 h-1 rounded-full bg-slate-300"></div>
        </div>

        <!-- Station name + status badge -->
        <div class="flex items-start justify-between mb-4">
            <div class="flex-1 pr-3">
                <h2 id="sheet-name" class="text-xl font-bold text-slate-900 leading-snug"></h2>
                <p id="sheet-status-text" class="text-sm font-medium mt-0.5"></p>
            </div>
            <span id="sheet-badge" class="shrink-0 px-3 py-1 rounded-full text-xs font-bold uppercase"></span>
        </div>

        <!-- Connector info row -->
        <div class="flex gap-3 mb-5">
            <div class="flex-1 flex items-center gap-3 bg-slate-50 rounded-2xl px-4 py-3">
                <div class="w-9 h-9 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-600 shrink-0">
                    <i class="fa-solid fa-plug text-base"></i>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wide">Conector</p>
                    <p id="sheet-tipo" class="text-sm font-bold text-slate-800"></p>
                </div>
            </div>
            <div class="flex-1 flex items-center gap-3 bg-slate-50 rounded-2xl px-4 py-3">
                <div class="w-9 h-9 rounded-xl bg-blue-100 flex items-center justify-center text-blue-600 shrink-0">
                    <i class="fa-solid fa-gauge-high text-base"></i>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wide">Potencia</p>
                    <p id="sheet-potencia" class="text-sm font-bold text-slate-800"></p>
                </div>
            </div>
        </div>

        <!-- Waze CTA -->
        <a id="sheet-waze-btn" href="#" target="_blank"
           class="btn-waze flex items-center justify-center gap-3 w-full py-4 rounded-2xl text-white font-bold text-base transition-transform">
            <i class="fa-brands fa-waze text-xl"></i>
            <span>Abrir en Waze</span>
            <i class="fa-solid fa-arrow-right text-sm opacity-75"></i>
        </a>
    </div>

    <!-- ══════════════ SCRIPTS ══════════════ -->
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN2GGnU=" crossorigin=""></script>

    <script>
    // ─────────────────────────────────────────────
    // DATA
    // ─────────────────────────────────────────────
    const estaciones = [
        {
            id: 1,
            nombre: "Enel X - Costanera",
            lat: -33.4169,
            lng: -70.6067,
            estado: "disponible",
            potencia: "50kW",
            tipo: "CCS2",
            tags: ["rapida", "disponible", "ccs2"]
        },
        {
            id: 2,
            nombre: "Copec Voltex - Vitacura",
            lat: -33.3815,
            lng: -70.5752,
            estado: "ocupado",
            potencia: "22kW",
            tipo: "Type 2",
            tags: ["copec"]
        },
        {
            id: 3,
            nombre: "Zeta Gas - Las Condes",
            lat: -33.4100,
            lng: -70.5680,
            estado: "disponible",
            potencia: "100kW",
            tipo: "CCS2",
            tags: ["rapida", "disponible", "ccs2"]
        },
        {
            id: 4,
            nombre: "Copec Voltex - Ñuñoa",
            lat: -33.4560,
            lng: -70.5990,
            estado: "disponible",
            potencia: "22kW",
            tipo: "Type 2",
            tags: ["disponible", "copec"]
        },
        {
            id: 5,
            nombre: "Enel X - Lo Barnechea",
            lat: -33.3600,
            lng: -70.5200,
            estado: "ocupado",
            potencia: "50kW",
            tipo: "CCS2",
            tags: ["rapida", "ccs2"]
        }
    ];

    // ─────────────────────────────────────────────
    // MAP INIT
    // ─────────────────────────────────────────────
    const map = L.map('map', {
        center: [-33.4372, -70.6506],
        zoom: 12,
        zoomControl: false
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    // Zoom control bottom-right
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ─────────────────────────────────────────────
    // CUSTOM PULSING ICON
    // ─────────────────────────────────────────────
    function createPinIcon(available) {
        const color = available ? 'pin-green' : 'pin-amber';
        const html = `
            <div class="pin-wrapper ${color}">
                <div class="pin-ring"></div>
                <div class="pin-dot"></div>
            </div>`;
        return L.divIcon({
            html,
            className: '',
            iconSize: [22, 22],
            iconAnchor: [11, 11],
            popupAnchor: [0, -14]
        });
    }

    // ─────────────────────────────────────────────
    // MARKERS
    // ─────────────────────────────────────────────
    const markers = [];

    estaciones.forEach(est => {
        const available = est.estado === 'disponible';
        const marker = L.marker([est.lat, est.lng], {
            icon: createPinIcon(available)
        }).addTo(map);

        marker.on('click', () => openSheet(est));
        markers.push({ marker, est });
    });

    // ─────────────────────────────────────────────
    // BOTTOM SHEET
    // ─────────────────────────────────────────────
    const sheet       = document.getElementById('bottom-sheet');
    const overlay     = document.getElementById('sheet-overlay');
    const sheetName   = document.getElementById('sheet-name');
    const sheetStatus = document.getElementById('sheet-status-text');
    const sheetBadge  = document.getElementById('sheet-badge');
    const sheetTipo   = document.getElementById('sheet-tipo');
    const sheetPot    = document.getElementById('sheet-potencia');
    const sheetWaze   = document.getElementById('sheet-waze-btn');

    function openSheet(est) {
        const available = est.estado === 'disponible';

        sheetName.textContent   = est.nombre;
        sheetTipo.textContent   = est.tipo;
        sheetPot.textContent    = est.potencia;

        if (available) {
            sheetStatus.textContent = '¡Disponible ahora! 🎉';
            sheetStatus.className   = 'text-sm font-medium mt-0.5 text-emerald-600';
            sheetBadge.textContent  = 'Disponible';
            sheetBadge.className    = 'shrink-0 px-3 py-1 rounded-full text-xs font-bold uppercase bg-emerald-100 text-emerald-700';
        } else {
            sheetStatus.textContent = 'Ocupado en este momento';
            sheetStatus.className   = 'text-sm font-medium mt-0.5 text-amber-600';
            sheetBadge.textContent  = 'En uso';
            sheetBadge.className    = 'shrink-0 px-3 py-1 rounded-full text-xs font-bold uppercase bg-amber-100 text-amber-700';
        }

        sheetWaze.href = `waze://?ll=${est.lat},${est.lng}&navigate=yes`;

        sheet.classList.add('open');
        overlay.classList.add('active');
    }

    function closeSheet() {
        sheet.classList.remove('open');
        overlay.classList.remove('active');
    }

    overlay.addEventListener('click', closeSheet);
    // Swipe down to close
    let touchStartY = 0;
    sheet.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
    sheet.addEventListener('touchend', e => {
        if (e.changedTouches[0].clientY - touchStartY > 60) closeSheet();
    }, { passive: true });

    // ─────────────────────────────────────────────
    // CHIPS / FILTER
    // ─────────────────────────────────────────────
    let activeFilter = 'all';

    document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            activeFilter = chip.dataset.filter;
            applyFilter();
            closeSheet();
        });
    });

    function applyFilter() {
        markers.forEach(({ marker, est }) => {
            const visible =
                activeFilter === 'all' ||
                est.tags.includes(activeFilter);

            if (visible) {
                if (!map.hasLayer(marker)) marker.addTo(map);
            } else {
                if (map.hasLayer(marker)) map.removeLayer(marker);
            }
        });
    }

    // Close sheet when tapping the map
    map.on('click', closeSheet);
    </script>
</body>
</html>
